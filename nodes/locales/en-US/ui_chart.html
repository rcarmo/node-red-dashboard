<script type="text/html" data-help-name="ui_chart">
    <p>Plots the input values on a chart. Supported chart types:</p>
    <ul>
        <li><b>Line</b>: Time-based line chart with optional smoothing and dot markers</li>
        <li><b>Bar</b>: Vertical or horizontal bar chart</li>
        <li><b>Pie</b>: Pie chart with optional donut cutout</li>
        <li><b>Polar area</b>: Polar area chart for proportional data</li>
        <li><b>Radar</b>: Radar/spider chart for multi-axis comparison</li>
        <li><b>Scatter</b>: X/Y scatter plot with configurable point size</li>
        <li><b>Funnel</b>: Funnel chart for pipeline/conversion data</li>
        <li><b>Heatmap</b>: Matrix heatmap for 2D data visualization</li>
    </ul>

    <h3>Live Data</h3>
    <p>To display live data, send a <code>msg.payload</code> containing a number. Each value will be converted to a number; if conversion fails, the message is ignored.</p>
    <p>Multiple series can be shown by using different <code>msg.topic</code> (or <code>msg.series</code>) values. Use <code>msg.label</code> to create multiple bars of the same color within a series.</p>
    <p>For line charts, send <code>null</code> or <code>false</code> as the payload to create gaps. Use <code>msg.timestamp</code> (epoch ms or ISO8601) to insert points at specific times.</p>
    <pre>{topic: "temperature", payload: 22, timestamp: 1520527095000}</pre>

    <h3>Stored Data (Complete Charts)</h3>
    <p>To display a complete chart in one message, use an array containing an object with <code>series</code>, <code>labels</code>, and <code>data</code> arrays:</p>

    <h4>Line Charts (time series)</h4>
    <pre>[{
  "series": ["A", "B"],
  "data": [
    [{"x": 1504029632890, "y": 5}, {"x": 1504029636001, "y": 4}],
    [{"x": 1504029633514, "y": 6}, {"x": 1504029636622, "y": 7}]
  ],
  "labels": [""]
}]</pre>

    <h4>Line Charts (categorical)</h4>
    <pre>[{
  "series": ["X", "Y", "Z"],
  "data": [[5, 6, 9], [3, 8, 5], [6, 7, 2]],
  "labels": ["Jan", "Feb", "Mar"]
}]</pre>

    <h4>Bar Charts</h4>
    <p>For bars of different colors (one value per series):</p>
    <pre>[{
  "series": ["X", "Y", "Z"],
  "data": [[5], [3], [6]],
  "labels": ["Jan"]
}]</pre>
    <p>For bars of the same color, enable "Use first colour for all bars":</p>
    <pre>[{
  "series": ["X"],
  "data": [[5, 6, 9]],
  "labels": ["Jan", "Feb", "Mar"]
}]</pre>

    <h4>Pie/Polar Area Charts</h4>
    <pre>[{
  "series": ["Sales"],
  "data": [[300, 500, 100]],
  "labels": ["Download", "In-Store", "Mail-Order"]
}]</pre>

    <h4>Radar Charts</h4>
    <pre>[{
  "series": ["Product A", "Product B"],
  "data": [[80, 90, 70, 85, 75], [65, 75, 80, 90, 70]],
  "labels": ["Quality", "Price", "Design", "Features", "Support"]
}]</pre>

    <h4>Scatter Charts</h4>
    <p>Each point is an <code>[x, y]</code> array. For time series, use epoch timestamps for x:</p>
    <pre>[{
  "series": ["Measurements"],
  "data": [[[1, 5], [2, 8], [3, 4], [4, 9]]],
  "labels": []
}]</pre>
    <p>Options: <code>symbolSize</code> (point size, default 10)</p>

    <h4>Funnel Charts</h4>
    <p>Visualizes conversion stages from labels to values:</p>
    <pre>[{
  "series": ["Pipeline"],
  "data": [[1000, 800, 500, 200, 50]],
  "labels": ["Visits", "Leads", "Qualified", "Proposals", "Sales"]
}]</pre>
    <p>Options: <code>funnelSort</code> (descending/ascending/none), <code>funnelAlign</code> (center/left/right), <code>funnelGap</code> (layer gap)</p>

    <h4>Heatmap Charts</h4>
    <p><b>Format 1:</b> Series-based (rows are series, columns are labels):</p>
    <pre>[{
  "series": ["Morning", "Afternoon", "Evening"],
  "data": [[5, 8, 3, 6], [9, 4, 7, 2], [3, 6, 8, 5]],
  "labels": ["Mon", "Tue", "Wed", "Thu"]
}]</pre>
    <p><b>Format 2:</b> Explicit matrix with <code>[xIndex, yIndex, value]</code> triplets:</p>
    <pre>[{
  "heatmapData": [[0, 0, 5], [1, 0, 10], [0, 1, 15], [1, 1, 20]],
  "heatmapXLabels": ["Col A", "Col B"],
  "heatmapYLabels": ["Row 1", "Row 2"]
}]</pre>
    <p>Options: <code>heatmapMin</code>/<code>heatmapMax</code> (color scale range)</p>

    <h3>Data Zoom</h3>
    <p>Enable pan/zoom on large datasets (line, bar, horizontalBar, scatter charts):</p>
    <ul>
        <li><code>dataZoom</code>: Enable zoom (true/false)</li>
        <li><code>dataZoomType</code>: "slider" (handle), "inside" (scroll/pinch), or "both"</li>
        <li><code>dataZoomStart</code>/<code>dataZoomEnd</code>: Initial zoom range (0-100%)</li>
    </ul>

    <h3>Mark Lines (Thresholds)</h3>
    <p>Add horizontal/vertical reference lines (line, bar, horizontalBar, scatter charts):</p>
    <pre>markLines: [
  { value: 75, label: "Target", color: "#00FF00" },
  { value: 25, label: "Min", lineStyle: "dashed" }
]</pre>
    <p>Options per line: <code>value</code>, <code>label</code>, <code>color</code>, <code>lineStyle</code> (solid/dashed/dotted), <code>axis</code> (x/y)</p>

    <h3>Clearing the Chart</h3>
    <p>Send <code>msg.payload</code> containing an empty array <code>[]</code> to clear the chart.</p>

    <h3>Chart Options</h3>
    <p>Minimum and Maximum <b>Y</b> axis values are optional. The graph will auto-scale to any values received.</p>
    <p>The <b>X</b> axis defines a time window or a maximum number of points to display. Older data will be automatically removed.
    The axis labels can be formatted using a <a href="https://momentjs.com/docs/#/displaying/format/" target="_blank">Moment.js format</a> string.</p>
    <p>The <b>Blank label</b> field displays text before any valid data is received.</p>
    <p>The label can also be set dynamically using <code>{{msg.topic}}</code> syntax.</p>
    <p>The node output contains the chart state array that can be persisted and re-sent to restore the chart.</p>
    <p>If a <b>Class</b> is specified, it will be added to the parent card for custom CSS styling. The Class can be set at runtime via <code>msg.className</code>.</p>
    <p>See <b><a href="https://github.com/node-red/node-red-dashboard/blob/master/Charts.md" target="_new">Charts.md</a></b> for additional examples and an importable example flow.</p>
</script>
