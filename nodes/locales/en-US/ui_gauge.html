<script type="text/html" data-help-name="ui_gauge">
    <p>Displays a numeric value visually using one of four gauge styles: standard gauge,
    donut, compass, or level (wave).</p>

    <h3>Gauge Types</h3>
    <p>Each type has different visual characteristics and use cases:</p>
    <dl class="message-properties">
        <dt>Gauge (default)</dt>
        <dd>Semi-circular meter with needle pointer. Best for showing values within
        a min/max range like temperature, speed, or pressure. Supports sector colors
        and the "fill from centre" option for differential displays.</dd>

        <dt>Donut</dt>
        <dd>Circular ring that fills proportionally. Good for percentages, progress,
        or capacity displays. Supports sector colors. Takes more vertical space than
        the standard gauge.</dd>

        <dt>Compass</dt>
        <dd>360° circular dial with directional pointer. Designed for heading/bearing
        values (0-360°). Does not use sector colors—uses theme colors instead.</dd>

        <dt>Level (Wave)</dt>
        <dd>Animated liquid-fill circle. Ideal for tank levels, battery charge, or
        any "fill" metaphor. Does not use sector colors—uses theme colors instead.</dd>
    </dl>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Label</dt>
        <dd>Title shown above the gauge. Can use <code>{{msg.topic}}</code> or
        <code>{{msg.property}}</code> for dynamic labels.</dd>

        <dt>Value Format</dt>
        <dd>Display format using Angular expressions. The value is available as
        <code>{{value}}</code>. Examples:
        <ul>
            <li><code>{{value}}</code> — raw number</li>
            <li><code>{{value | number:1}}%</code> — one decimal, percent sign</li>
            <li><code>{{value | number:0}} °C</code> — integer with unit</li>
            <li><code>{{msg.custom}}</code> — use a different message property</li>
        </ul></dd>

        <dt>Units</dt>
        <dd>Sub-label shown below the value (e.g., "km/h", "PSI", "liters").</dd>

        <dt>Range (min/max)</dt>
        <dd>Defines the gauge scale. For compass type, typically 0-360.
        <b>Tip:</b> Setting min &gt; max reverses the gauge direction.</dd>
    </dl>

    <h3>Sector Colors</h3>
    <p>Available for <b>Gauge</b> and <b>Donut</b> types only.</p>
    <p>Three colors define the gradient from min to max. Colors must be in hex format
    (<code>#rrggbb</code>). Default: green → yellow → red.</p>

    <h4>Color Blending Modes</h4>
    <table>
        <tr><th>Sectors Config</th><th>Behavior</th></tr>
        <tr>
            <td>Both blank</td>
            <td>Colors blend smoothly across entire range (gradient)</td>
        </tr>
        <tr>
            <td>Values specified</td>
            <td>Discrete color zones: min→seg1 (color1), seg1→seg2 (color2), seg2→max (color3)</td>
        </tr>
    </table>
    <p><b>Example:</b> For a 0-100 gauge with sectors at 30 and 70:<br>
    0-30 = green, 30-70 = yellow, 70-100 = red (like a "good/warning/danger" indicator).</p>

    <h4>Fill from Centre</h4>
    <p>Available for <b>Gauge</b> type only. When enabled, the gauge fills outward from
    a center point rather than from minimum. Useful for differential measurements where
    values can be positive or negative relative to a baseline.</p>

    <h3>Input</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">number</span></dt>
        <dd>The numeric value to display. Non-numeric values are ignored.</dd>

        <dt>className <span class="property-type">string</span></dt>
        <dd>Optional. Dynamically set CSS class(es) on the widget container.</dd>
    </dl>

    <h3>Sizing Behavior</h3>
    <p>Gauge dimensions affect the display:</p>
    <ul>
        <li><b>Height = 1:</b> Min/max labels are automatically hidden</li>
        <li><b>Donut/Compass:</b> Auto-height is approximately (width - 1) units</li>
        <li><b>Level (Wave):</b> Auto-height is approximately (width × 0.75) units</li>
        <li><b>Standard Gauge:</b> Auto-height is approximately (width × 0.5 + 1.5) units</li>
    </ul>

    <h3>Styling</h3>
    <p>Use the <b>Class</b> field to add custom CSS classes. The widget structure allows
    targeting:</p>
    <pre>.my-gauge .gauge-value { font-size: 24px !important; }
.my-gauge .gauge-label { color: #666 !important; }</pre>

    <h3>Best Practices</h3>
    <ul>
        <li>Choose gauge type based on the data metaphor (speed→gauge, level→wave, heading→compass)</li>
        <li>Use meaningful sector boundaries (e.g., normal/warning/critical thresholds)</li>
        <li>Keep value format concise—gauges have limited display space</li>
        <li>For percentages, use 0-100 range with Level type for intuitive display</li>
        <li>Compass type expects 0-360 input; other ranges may display unexpectedly</li>
    </ul>
</script>
